name: Release macOS

# Publishing requires an explicitly approved stable version tag (vX.Y.Z).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

env:
  APP: MediaCenter
  CASK: media-center
  TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
  PROFILE_ID: ${{ vars.MACOS_PROVISIONING_PROFILE_ID }}

jobs:
  submit:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      archive_sha256: ${{ steps.submission.outputs.archive_sha256 }}
      receipt_sha256: ${{ steps.submission.outputs.receipt_sha256 }}
      submission_id: ${{ steps.submission.outputs.submission_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release inputs
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use a stable version tag such as v0.1.0.' >&2; exit 1; }
          [[ "$PROFILE_ID" =~ ^[A-Z0-9]+$ ]] || { echo 'Set repository variable MACOS_PROVISIONING_PROFILE_ID.' >&2; exit 1; }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test shared models and generate project
        run: |
          swift test --package-path packages/MediaKit --jobs 2
          brew install xcodegen
          "$(realpath "$(command -v xcodegen)")" generate --spec apps/macos/project.yml

      - uses: 1Password/install-cli-action@v4
      # Bootstrap manifest refs use names. Apple Signing is the documented shared
      # signing exception for CI only; the app never receives these credentials.
      - name: Load signing material
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEVELOPER_ID_P12_BASE64: op://Apple Signing/Developer ID Application Cert/p12_base64
          DEVELOPER_ID_P12_PASSWORD: op://Apple Signing/Developer ID Application Cert/password
          ASC_KEY_P8_BASE64: op://Apple Signing/App Store Connect API Key/p8_base64
          ASC_KEY_ID: op://Apple Signing/App Store Connect API Key/key_id
          ASC_ISSUER_ID: op://Apple Signing/App Store Connect API Key/issuer_id

      - name: Sign and verify app
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          # Remember the runner's search list so cleanup restores it exactly.
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          eval "existing=($(tr -d '\n' < "$RUNNER_TEMP/keychains-before.txt"))"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          IDENTITY_SHA=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          TEAM_ID=$(printf '%s' "$IDENTITY" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          [[ "$IDENTITY_SHA" =~ ^[A-F0-9]{40}$ && "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          printf 'TEAM_ID=%s\nIDENTITY_SHA=%s\n' "$TEAM_ID" "$IDENTITY_SHA" >> "$GITHUB_ENV"
          # Read the app-owned MAC_APP_DIRECT profile by its stable API ID; never create one here.
          PROFILE_UUID=$(node --input-type=module - <<'JS'
          import {createPrivateKey, sign} from 'node:crypto';
          import {mkdirSync, writeFileSync} from 'node:fs';
          import {homedir} from 'node:os';
          const encode = v => Buffer.from(JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const input = encode({alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT'}) + '.' + encode({iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 120, aud: 'appstoreconnect-v1'});
          const key = createPrivateKey(Buffer.from(process.env.ASC_KEY_P8_BASE64, 'base64'));
          const jwt = input + '.' + sign('sha256', Buffer.from(input), {key, dsaEncoding: 'ieee-p1363'}).toString('base64url');
          const response = await fetch('https://api.appstoreconnect.apple.com/v1/profiles/' + encodeURIComponent(process.env.PROFILE_ID), {headers: {Authorization: 'Bearer ' + jwt}});
          if (!response.ok) throw Error('Profile download HTTP ' + response.status);
          const profile = (await response.json()).data.attributes;
          if (profile.profileType !== 'MAC_APP_DIRECT' || profile.profileState !== 'ACTIVE' || Date.parse(profile.expirationDate) <= Date.now()) throw Error('Active Developer ID profile required');
          if (!/^[a-f0-9-]{36}$/i.test(profile.uuid)) throw Error('Invalid profile UUID');
          const directory = homedir() + '/Library/Developer/Xcode/UserData/Provisioning Profiles';
          mkdirSync(directory, {recursive: true});
          writeFileSync(directory + '/' + profile.uuid + '.provisionprofile', Buffer.from(profile.profileContent, 'base64'));
          console.log(profile.uuid);
          JS
          )
          xcodebuild -project apps/macos/MediaCenter.xcodeproj -scheme MediaCenter -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            -archivePath "$RUNNER_TEMP/$APP.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -quiet archive
          bundle=$(plutil -extract CFBundleIdentifier raw -o - "$RUNNER_TEMP/$APP.xcarchive/Products/Applications/$APP.app/Contents/Info.plist")
          plutil -create xml1 "$RUNNER_TEMP/export-options.plist"
          plutil -insert method -string developer-id "$RUNNER_TEMP/export-options.plist"
          plutil -insert signingStyle -string manual "$RUNNER_TEMP/export-options.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/export-options.plist"
          plutil -insert signingCertificate -string "$IDENTITY_SHA" "$RUNNER_TEMP/export-options.plist"
          plutil -insert provisioningProfiles -dictionary "$RUNNER_TEMP/export-options.plist"
          plutil -insert "provisioningProfiles.$bundle" -string "$PROFILE_UUID" "$RUNNER_TEMP/export-options.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$APP.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"
          mkdir -p build
          ditto "$RUNNER_TEMP/export/$APP.app" "build/$APP.app"
          python3 scripts/verify-macos-signing.py "build/$APP.app" "$TEAM_ID" "$IDENTITY_SHA"
          codesign -d --entitlements - --xml "build/$APP.app" > "$RUNNER_TEMP/entitlements.plist"
          bash scripts/test-macos-keychain.sh "build/$APP.app" "$IDENTITY_SHA" "$RUNNER_TEMP/entitlements.plist"

      - name: Submit signed archive
        id: submission
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          ditto -c -k --keepParent "build/$APP.app" "build/$APP-notarize.zip"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          # Upload once. Waiting belongs to the independently retryable release job.
          xcrun notarytool submit "build/$APP-notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --no-wait --output-format json > "$RUNNER_TEMP/submission.json"
          python3 - <<'PYTHON'
          import hashlib, json, os, re
          from pathlib import Path
          env = os.environ
          submission = json.loads((Path(env["RUNNER_TEMP"]) / "submission.json").read_text())["id"]
          if not re.fullmatch(r"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}", submission):
              raise ValueError("Invalid Apple submission UUID")
          archive_sha = hashlib.sha256(Path(f"build/{env['APP']}-notarize.zip").read_bytes()).hexdigest()
          receipt = {"schemaVersion": 1, "repository": env["GITHUB_REPOSITORY"], "runId": env["GITHUB_RUN_ID"],
                     "runNumber": env["GITHUB_RUN_NUMBER"], "sourceSha": env["GITHUB_SHA"], "tag": env["GITHUB_REF_NAME"],
                     "version": env["RELEASE_VERSION"], "archiveSha256": archive_sha, "submissionId": submission,
                     "teamId": env["TEAM_ID"], "certificateSha1": env["IDENTITY_SHA"]}
          raw = (json.dumps(receipt, sort_keys=True) + "\n").encode()
          Path("build/notarization-receipt.json").write_bytes(raw)
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write(f"archive_sha256={archive_sha}\nsubmission_id={submission}\nreceipt_sha256={hashlib.sha256(raw).hexdigest()}\n")
          PYTHON

      # Only the submitted ZIP and its receipt are retained: never runner temp,
      # P12, keychain or loose profiles. The embedded profile stays in the ZIP.
      - name: Preserve signed submission
        id: artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-submission-${{ github.run_id }}
          path: |
            build/MediaCenter-notarize.zip
            build/notarization-receipt.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          if [ -f "$RUNNER_TEMP/keychains-before.txt" ]; then
            eval "existing=($(tr -d '\n' < "$RUNNER_TEMP/keychains-before.txt"))"
            security list-keychains -d user -s "${existing[@]}"
          fi
          [ ! -f "$RUNNER_TEMP/release.keychain-db" ] || security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.provisionprofile

  # Retry only this job after a notary timeout: the successful submit job's
  # artifact survives the run attempt. Expired or missing artifacts fail
  # closed; never rebuild or resubmit as a fallback.
  release:
    needs: submit
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.receipt.outputs.version }}
    env:
      EXPECTED_ARTIFACT_ID: ${{ needs.submit.outputs.artifact_id }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.submit.outputs.archive_sha256 }}
      EXPECTED_RECEIPT_SHA256: ${{ needs.submit.outputs.receipt_sha256 }}
      EXPECTED_SUBMISSION_ID: ${{ needs.submit.outputs.submission_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require saved artifact identity
        run: |
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Missing saved artifact ID; do not rebuild or resubmit.' >&2; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.submit.outputs.artifact_id }}
          path: saved
      - name: Validate saved submission
        id: receipt
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, re
          from pathlib import Path
          env = os.environ
          raw = Path("saved/notarization-receipt.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != env["EXPECTED_RECEIPT_SHA256"]:
              raise ValueError("Saved receipt digest mismatch")
          receipt = json.loads(raw)
          expected = {"schemaVersion": 1, "repository": env["GITHUB_REPOSITORY"], "runId": env["GITHUB_RUN_ID"],
                      "runNumber": env["GITHUB_RUN_NUMBER"], "sourceSha": env["GITHUB_SHA"], "tag": env["GITHUB_REF_NAME"],
                      "version": env["GITHUB_REF_NAME"].removeprefix("v"),
                      "archiveSha256": env["EXPECTED_ARCHIVE_SHA256"], "submissionId": env["EXPECTED_SUBMISSION_ID"]}
          if any(receipt.get(k) != v for k, v in expected.items()):
              raise ValueError("Saved submission provenance mismatch")
          if not re.fullmatch(r"[A-Z0-9]{10}", receipt["teamId"]) or not re.fullmatch(r"[A-Fa-f0-9]{40}", receipt["certificateSha1"]):
              raise ValueError("Invalid saved signing identity")
          archive = Path(f"saved/{env['APP']}-notarize.zip")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != receipt["archiveSha256"]:
              raise ValueError("Saved submitted ZIP digest mismatch")
          with open(env["GITHUB_ENV"], "a") as out:
              for name, value in {"SUBMISSION_ID": receipt["submissionId"], "SUBMITTED_SHA256": receipt["archiveSha256"],
                                  "RELEASE_VERSION": receipt["version"], "SIGNING_TEAM": receipt["teamId"],
                                  "SIGNING_CERTIFICATE": receipt["certificateSha1"]}.items():
                  out.write(f"{name}={value}\n")
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={receipt['version']}\n")
          PYTHON

      - uses: 1Password/install-cli-action@v4
      - name: Load notary key
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ASC_KEY_P8_BASE64: op://Apple Signing/App Store Connect API Key/p8_base64
          ASC_KEY_ID: op://Apple Signing/App Store Connect API Key/key_id
          ASC_ISSUER_ID: op://Apple Signing/App Store Connect API Key/issuer_id
      - name: Wait for existing notarization
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool wait "$SUBMISSION_ID" --key "$RUNNER_TEMP/notary.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --timeout 30m --output-format json > "$RUNNER_TEMP/notary-status.json"
          xcrun notarytool log "$SUBMISSION_ID" --key "$RUNNER_TEMP/notary.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" "$RUNNER_TEMP/notary-log.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          temp, env = Path(os.environ["RUNNER_TEMP"]), os.environ
          status = json.loads((temp / "notary-status.json").read_text())
          if status.get("id") != env["SUBMISSION_ID"] or status.get("status") != "Accepted":
              raise ValueError("Expected Accepted status for the saved submission")
          log = json.loads((temp / "notary-log.json").read_text())
          if (log.get("jobId") != env["SUBMISSION_ID"] or log.get("sha256") != env["SUBMITTED_SHA256"]
                  or log.get("status") != "Accepted" or log.get("statusCode") != 0):
              raise ValueError("Notary log does not accept this exact submitted ZIP")
          PYTHON

      - name: Package accepted app
        id: package
        run: |
          set -euo pipefail
          mkdir -p build
          ditto -x -k "saved/$APP-notarize.zip" build
          python3 - <<'PYTHON'
          import os, plistlib
          from pathlib import Path
          info = plistlib.loads(Path(f"build/{os.environ['APP']}.app/Contents/Info.plist").read_bytes())
          if info.get("CFBundleShortVersionString") != os.environ["RELEASE_VERSION"] or info.get("CFBundleVersion") != os.environ["GITHUB_RUN_NUMBER"]:
              raise ValueError("Saved app version/build mismatch")
          PYTHON
          python3 scripts/verify-macos-signing.py "build/$APP.app" "$SIGNING_TEAM" "$SIGNING_CERTIFICATE"
          xcrun stapler staple "build/$APP.app"
          xcrun stapler validate "build/$APP.app"
          codesign --verify --deep --strict "build/$APP.app"
          spctl --assess --type execute --verbose=2 "build/$APP.app"
          ditto -c -k --keepParent "build/$APP.app" "build/$APP-$GITHUB_REF_NAME.zip"
          (cd build && shasum -a 256 "$APP-$GITHUB_REF_NAME.zip" > SHA256SUMS)
          echo "sha256=$(awk '{print $1}' build/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published assets are immutable: an existing release needs review, never replacement.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME already exists" >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "build/$APP-$GITHUB_REF_NAME.zip" build/SHA256SUMS

  # Optional and separate: a tap failure is retried without republishing the release.
  cask:
    needs: release
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: 1Password/install-cli-action@v4
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TAP_PUSH_TOKEN: op://Apple Signing/Homebrew Tap Push Token/token
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ env.TAP_PUSH_TOKEN }}
          path: tap
      - name: Update Homebrew cask
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$SHA256" =~ ^[0-9a-f]{64}$ ]]
          file="tap/Casks/$CASK.rb"
          if [ -f "$file" ]; then
            previous=$(sed -nE 's/^ *version "([^"]+)"$/\1/p' "$file")
            newest=$(printf '%s\n%s\n' "$previous" "$RELEASE_VERSION" | sort -V | tail -1)
            if [ "$previous" = "$RELEASE_VERSION" ] || [ "$newest" != "$RELEASE_VERSION" ]; then
              echo "Cask already has $previous; leaving it unchanged."; exit 0
            fi
          fi
          mkdir -p tap/Casks
          cat > "$file" <<EOF
          cask "$CASK" do
            version "$RELEASE_VERSION"
            sha256 "$SHA256"

            url "https://github.com/$GITHUB_REPOSITORY/releases/download/v#{version}/$APP-v#{version}.zip"
            name "Media Center"
            desc "Feed of saved and newly released articles, videos and TV"
            homepage "https://github.com/$GITHUB_REPOSITORY"

            depends_on macos: :sonoma
            app "$APP.app"
          end
          EOF
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C tap add "Casks/$CASK.rb"
          git -C tap commit -m "Media Center $RELEASE_VERSION"
          git -C tap push
