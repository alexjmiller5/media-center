name: Release macOS

# Publishing requires an explicitly approved stable version tag (vX.Y.Z).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

env:
  APP: MediaCenter
  CASK: media-center
  TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
  PROFILE_ID: ${{ vars.MACOS_PROVISIONING_PROFILE_ID }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release inputs
        id: inputs
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use a stable version tag such as v0.1.0.' >&2; exit 1; }
          [[ "$TAP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo 'Set repository variable HOMEBREW_TAP_REPOSITORY.' >&2; exit 1; }
          [[ "$PROFILE_ID" =~ ^[A-Z0-9]+$ ]] || { echo 'Set repository variable MACOS_PROVISIONING_PROFILE_ID.' >&2; exit 1; }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test shared models and generate project
        run: |
          swift test --package-path packages/MediaKit --jobs 2
          brew install xcodegen
          "$(realpath "$(command -v xcodegen)")" generate --spec apps/macos/project.yml

      - uses: 1Password/install-cli-action@v4
      # Bootstrap manifest refs use names. Apple Signing is the documented shared
      # signing exception for CI only; the app never receives these credentials.
      - name: Load signing material
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEVELOPER_ID_P12_BASE64: op://Apple Signing/Developer ID Application Cert/p12_base64
          DEVELOPER_ID_P12_PASSWORD: op://Apple Signing/Developer ID Application Cert/password
          ASC_KEY_P8_BASE64: op://Apple Signing/App Store Connect API Key/p8_base64
          ASC_KEY_ID: op://Apple Signing/App Store Connect API Key/key_id
          ASC_ISSUER_ID: op://Apple Signing/App Store Connect API Key/issuer_id

      - name: Sign and verify app
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          # Remember the runner's search list so cleanup restores it exactly.
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          eval "existing=($(tr -d '\n' < "$RUNNER_TEMP/keychains-before.txt"))"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          IDENTITY_SHA=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          TEAM_ID=$(printf '%s' "$IDENTITY" | sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p')
          [[ "$IDENTITY_SHA" =~ ^[A-F0-9]{40}$ && "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          # Read the app-owned MAC_APP_DIRECT profile by its stable API ID; never create one here.
          PROFILE_UUID=$(node --input-type=module - <<'JS'
          import {createPrivateKey, sign} from 'node:crypto';
          import {mkdirSync, writeFileSync} from 'node:fs';
          import {homedir} from 'node:os';
          const encode = v => Buffer.from(JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const input = encode({alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT'}) + '.' + encode({iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 120, aud: 'appstoreconnect-v1'});
          const key = createPrivateKey(Buffer.from(process.env.ASC_KEY_P8_BASE64, 'base64'));
          const jwt = input + '.' + sign('sha256', Buffer.from(input), {key, dsaEncoding: 'ieee-p1363'}).toString('base64url');
          const response = await fetch('https://api.appstoreconnect.apple.com/v1/profiles/' + encodeURIComponent(process.env.PROFILE_ID), {headers: {Authorization: 'Bearer ' + jwt}});
          if (!response.ok) throw Error('Profile download HTTP ' + response.status);
          const profile = (await response.json()).data.attributes;
          if (profile.profileType !== 'MAC_APP_DIRECT' || profile.profileState !== 'ACTIVE' || Date.parse(profile.expirationDate) <= Date.now()) throw Error('Active Developer ID profile required');
          if (!/^[a-f0-9-]{36}$/i.test(profile.uuid)) throw Error('Invalid profile UUID');
          const directory = homedir() + '/Library/Developer/Xcode/UserData/Provisioning Profiles';
          mkdirSync(directory, {recursive: true});
          writeFileSync(directory + '/' + profile.uuid + '.provisionprofile', Buffer.from(profile.profileContent, 'base64'));
          console.log(profile.uuid);
          JS
          )
          xcodebuild -project apps/macos/MediaCenter.xcodeproj -scheme MediaCenter -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/derived" \
            -archivePath "$RUNNER_TEMP/$APP.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -quiet archive
          bundle=$(plutil -extract CFBundleIdentifier raw -o - "$RUNNER_TEMP/$APP.xcarchive/Products/Applications/$APP.app/Contents/Info.plist")
          plutil -create xml1 "$RUNNER_TEMP/export-options.plist"
          plutil -insert method -string developer-id "$RUNNER_TEMP/export-options.plist"
          plutil -insert signingStyle -string manual "$RUNNER_TEMP/export-options.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/export-options.plist"
          plutil -insert signingCertificate -string "$IDENTITY_SHA" "$RUNNER_TEMP/export-options.plist"
          plutil -insert provisioningProfiles -dictionary "$RUNNER_TEMP/export-options.plist"
          plutil -insert "provisioningProfiles.$bundle" -string "$PROFILE_UUID" "$RUNNER_TEMP/export-options.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$APP.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"
          mkdir -p build
          ditto "$RUNNER_TEMP/export/$APP.app" "build/$APP.app"
          python3 scripts/verify-macos-signing.py "build/$APP.app" "$TEAM_ID" "$IDENTITY_SHA"

      - name: Notarize and staple
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          ditto -c -k --keepParent "build/$APP.app" "build/$APP-notarize.zip"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "build/$APP-notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "build/$APP.app"
          xcrun stapler validate "build/$APP.app"
          spctl --assess --type execute --verbose=2 "build/$APP.app"

      - name: Package release asset
        id: package
        run: |
          ditto -c -k --keepParent "build/$APP.app" "build/$APP-$GITHUB_REF_NAME.zip"
          (cd build && shasum -a 256 "$APP-$GITHUB_REF_NAME.zip" > SHA256SUMS)
          echo "sha256=$(awk '{print $1}' build/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          if [ -f "$RUNNER_TEMP/keychains-before.txt" ]; then
            eval "existing=($(tr -d '\n' < "$RUNNER_TEMP/keychains-before.txt"))"
            security list-keychains -d user -s "${existing[@]}"
          fi
          [ ! -f "$RUNNER_TEMP/release.keychain-db" ] || security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.provisionprofile

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published assets are immutable: an existing release needs review, never replacement.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME already exists" >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "build/$APP-$GITHUB_REF_NAME.zip" build/SHA256SUMS

  # Separate job: a tap failure is retried without republishing the release.
  cask:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: 1Password/install-cli-action@v4
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TAP_PUSH_TOKEN: op://Apple Signing/Homebrew Tap Push Token/token
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ env.TAP_PUSH_TOKEN }}
          path: tap
      - name: Update Homebrew cask
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$SHA256" =~ ^[0-9a-f]{64}$ ]]
          file="tap/Casks/$CASK.rb"
          if [ -f "$file" ]; then
            previous=$(sed -nE 's/^ *version "([^"]+)"$/\1/p' "$file")
            newest=$(printf '%s\n%s\n' "$previous" "$RELEASE_VERSION" | sort -V | tail -1)
            if [ "$previous" = "$RELEASE_VERSION" ] || [ "$newest" != "$RELEASE_VERSION" ]; then
              echo "Cask already has $previous; leaving it unchanged."; exit 0
            fi
          fi
          mkdir -p tap/Casks
          cat > "$file" <<EOF
          cask "$CASK" do
            version "$RELEASE_VERSION"
            sha256 "$SHA256"

            url "https://github.com/$GITHUB_REPOSITORY/releases/download/v#{version}/$APP-v#{version}.zip"
            name "Media Center"
            desc "Feed of saved and newly released articles, videos and TV"
            homepage "https://github.com/$GITHUB_REPOSITORY"

            depends_on macos: :sonoma
            app "$APP.app"
          end
          EOF
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C tap add "Casks/$CASK.rb"
          git -C tap commit -m "Media Center $RELEASE_VERSION"
          git -C tap push
