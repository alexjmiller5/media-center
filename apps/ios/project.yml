name: MediaCenter
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: 1
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
packages:
  MediaKit:
    path: ../../packages/MediaKit
targets:
  MediaCenter:
    type: application
    platform: iOS
    sources: [App, ../Shared]
    dependencies:
      - package: MediaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.media-center
        PRODUCT_NAME: MediaCenter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Media Center
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROFILE}
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
  MediaCenterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alexmiller.media-center.uitests
        PRODUCT_NAME: MediaCenterUITests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: MediaCenter
    dependencies:
      - target: MediaCenter
schemes:
  MediaCenter:
    build:
      targets:
        MediaCenter: all
        MediaCenterUITests: [test]
    test:
      targets: [MediaCenterUITests]
